name: NuroMow Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Triggers on release tags (e.g., v1.0.63, v2.1.0)
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build & Release NuroMow APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so changelogs can be generated

      # 2. Set up Java 17 (Required for modern Gradle and Flutter builds)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle' # Automatically caches Gradle dependencies for faster builds

      # 3. Set up Flutter (Caches packages automatically)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:" # Optimizes caching

      # 4. Get Flutter Package Dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 5. Extract Version Name from pubspec.yaml and set Build Number
      - name: Extract Version Info
        id: version_info
        run: |
          # Read version from pubspec.yaml (e.g. 1.0.0+1)
          VERSION_LINE=$(grep 'version: ' pubspec.yaml)
          VERSION_NAME=$(echo "$VERSION_LINE" | cut -d ' ' -f 2 | cut -d '+' -f 1)
          
          # Use GitHub's build run number as the unique build number
          BUILD_NUMBER=${{ github.run_number }}
          
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          
          echo "Building Version: $VERSION_NAME (Build: $BUILD_NUMBER)"

      # 6. Decode Android Signing Keystore File from GitHub Secrets
      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: KEYSTORE_BASE64 secret is missing!"
            exit 1
          fi
          # Decodes and writes the keystore file to the exact path expected by build.gradle.kts
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks

      # 7. Build Signed Release APK
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name=$VERSION_NAME \
            --build-number=$BUILD_NUMBER

      # 8. Rename the output APK to a professional branded filename
      - name: Prepare APK Artifact
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/NuroMow-v${{ env.VERSION_NAME }}-${{ env.BUILD_NUMBER }}.apk

      # 9. Upload Built APK as a workflow run artifact (Always accessible on GitHub Actions)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuroMow-APK
          path: build/app/outputs/flutter-apk/NuroMow-v${{ env.VERSION_NAME }}-${{ env.BUILD_NUMBER }}.apk
          if-no-files-found: error
          retention-days: 7

      # 10. Create and Publish Release (Only runs when a version tag 'v*' is pushed)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/NuroMow-v${{ env.VERSION_NAME }}-${{ env.BUILD_NUMBER }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true # Automatically generates a beautiful changelog from commit messages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Provided automatically by GitHub

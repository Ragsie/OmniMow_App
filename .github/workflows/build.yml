name: OmniMow CI/CD Rolling Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Triggers on release tags (e.g., v1.0.63, v2.1.0)
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  # ==========================================
  # JOB 1: BUILD SIGNED ANDROID APK
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so changelogs can be generated

      # 2. Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle' # Caches Gradle dependencies for speed

      # 3. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # 4. Get Flutter Package Dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 5. Extract Version Name and Set Release Variables Dynamically
      - name: Extract Version Info & Setup Release Type
        id: release_setup
        run: |
          VERSION_LINE=$(grep 'version: ' pubspec.yaml)
          VERSION_NAME=$(echo "$VERSION_LINE" | cut -d ' ' -f 2 | cut -d '+' -f 1)
          BUILD_NUMBER=${{ github.run_number }}
          
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          
          # Check if this is a tagged release or a rolling release from main
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "RELEASE_NAME=OmniMow v$VERSION_NAME (Build $BUILD_NUMBER)" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            echo "APK_FILE=OmniMow-v$VERSION_NAME-$BUILD_NUMBER.apk" >> $GITHUB_ENV
            echo "Building permanent tag release: OmniMow-v$VERSION_NAME-$BUILD_NUMBER.apk"
          else
            echo "RELEASE_TAG=latest" >> $GITHUB_ENV
            echo "RELEASE_NAME=OmniMow Latest Build (v$VERSION_NAME-$BUILD_NUMBER)" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "APK_FILE=OmniMow-latest-android.apk" >> $GITHUB_ENV
            echo "Building rolling development release: OmniMow-latest-android.apk"
          fi

      # 6. Decode Android Signing Keystore File from GitHub Secrets
      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Warning: KEYSTORE_BASE64 secret is missing! Building unsigned/debug-signed APK instead."
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          fi

      # 7. Build Release APK (Uses secrets if available, falls back to debug signing if not)
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name=$VERSION_NAME \
            --build-number=$BUILD_NUMBER

      # 8. Rename output APK dynamically based on Release Type
      - name: Prepare APK Artifact
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/${{ env.APK_FILE }}

      # 9. Upload Built APK as a workflow run artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniMow-Android-APK
          path: build/app/outputs/flutter-apk/${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 7

      # 10. Create or Update GitHub Release (Runs on tags AND on every push to main for rolling releases)
      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ### OmniMow Build Information
            * **Commit SHA:** `${{ github.sha }}`
            * **Build Number:** `${{ env.BUILD_NUMBER }}`
            * **Version Name:** `${{ env.VERSION_NAME }}`
            * **Release Type:** ${{ env.RELEASE_TAG == 'latest' && '🔄 Rolling Development Release' || '📦 Permanent Tagged Release' }}
            
            *If you are downloading the rolling release, these assets are automatically updated on every push to the \`main\` branch. Links remain constant.*
          files: build/app/outputs/flutter-apk/${{ env.APK_FILE }}
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # JOB 2: BUILD UNSIGNED IOS BUNDLE (.ZIP)
  # ==========================================
  build-ios:
    name: Build iOS Package
    runs-on: macos-latest
    permissions:
      contents: write
    needs: build-android # Wait for Android job to create the release first (to append assets)

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # 3. Get Flutter Package Dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 4. Extract Version Name and Set Release Variables Dynamically
      - name: Extract Version Info & Setup Release Type
        id: release_setup
        run: |
          VERSION_LINE=$(grep 'version: ' pubspec.yaml)
          VERSION_NAME=$(echo "$VERSION_LINE" | cut -d ' ' -f 2 | cut -d '+' -f 1)
          BUILD_NUMBER=${{ github.run_number }}
          
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "IOS_FILE=OmniMow-v$VERSION_NAME-$BUILD_NUMBER-ios-unsigned.zip" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=latest" >> $GITHUB_ENV
            echo "IOS_FILE=OmniMow-latest-ios-unsigned.zip" >> $GITHUB_ENV
          fi

      # 5. Build iOS App (No Codesign - free of developer account constraints)
      - name: Build iOS App (No Codesign)
        run: flutter build ios --release --no-codesign

      # 6. Package iOS Runner.app into a ZIP for Sideloadly / AltStore
      - name: Package iOS payload for sideloading
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../../../${{ env.IOS_FILE }} Payload
          cd ../../../

      # 7. Upload Built ZIP as a workflow run artifact
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniMow-iOS-Unsigned-ZIP
          path: ${{ env.IOS_FILE }}
          if-no-files-found: error
          retention-days: 7

      # 8. Upload iOS ZIP to the same GitHub Release
      - name: Upload iOS to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.IOS_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

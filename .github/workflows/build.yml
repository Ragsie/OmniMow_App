name: Build Flutter APK with Auto Version

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important: Fetches the entire history so we can count commits

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'
          architecture: 'x64'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # --- AUTOMATIC VERSIONING STEP ---
      - name: Update pubspec.yaml version
        run: |
          # Calculate new build number based on the number of git commits
          BUILD_NUMBER=$(git rev-list --count HEAD)
          
          # Define your base version (e.g., 1.0.0)
          VERSION_NAME="1.0.$BUILD_NUMBER"
          
          echo "Setting app version to: $VERSION_NAME+${BUILD_NUMBER}"
          
          # Automatically replace the version line in pubspec.yaml
          sed -i "s/^version: .*/version: $VERSION_NAME+$BUILD_NUMBER/" pubspec.yaml

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ros-app-$BUILD_NUMBER
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'
          architecture: 'x64'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Package iOS build
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r ../../../ios-app.zip Payload
          cd ../../../

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: ios-app.zip

name: Build and Release All Platforms

on:
  push:
    branches: [ "main", "master" ]

jobs:
  # --- JOB 1: ANDROID (APK) ---
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'
          architecture: 'x64'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Update pubspec.yaml version
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          VERSION_NAME="1.0.$BUILD_NUMBER"
          
          echo "Setting app version to: $VERSION_NAME+${BUILD_NUMBER}"
          sed -i "s/^version: .*/version: $VERSION_NAME+$BUILD_NUMBER/" pubspec.yaml
          
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Build APK
        run: flutter build apk --release

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-${{ env.BUILD_NUMBER }}
          name: "Mower App v${{ env.VERSION_NAME }} (Build ${{ env.BUILD_NUMBER }})"
          body: |
            Automated release built from commit: ${{ github.sha }}
            - Includes latest updates for the ROS 2 Mower app (Android & iOS).
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# --- JOB 2: IOS (IPA / ZIP) ---
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write
    needs: build-android 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'
          architecture: 'x64'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Calculate version
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          VERSION_NAME="1.0.$BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Build iOS App (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package iOS app into zip
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r ../../../ios-app-unsigned.zip Payload
          cd ../../../

      - name: Upload iOS Zip to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-${{ env.BUILD_NUMBER }}
          files: |
            ios-app-unsigned.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: OmniMow Android & iOS Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Triggers on release tags (e.g., v1.0.63, v2.1.0)
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-android:
    name: Build Android APK
    # In a private repository the build only runs when started by hand (Actions -> Run workflow, or
    # by pushing a v* tag), so it uses no Actions minutes by itself. Public repositories (free
    # minutes) build every push. The iOS job waits for this one and is skipped with it.
    if: >-
      ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Fetches all history so changelogs can be generated
          persist-credentials: false # nothing here pushes with git, so keep the token out of .git/config

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle' # Caches Gradle dependencies for speed

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: '3.50.1'
          # No cache in this job: flutter-action calls actions/cache by tag, and this job has the keystore
          cache: false

      - name: Install Dependencies
        run: flutter pub get

      - name: Extract Version Info & Setup Release Type
        id: release_setup
        run: |
          VERSION_LINE=$(grep 'version: ' pubspec.yaml)
          VERSION_NAME=$(echo "$VERSION_LINE" | cut -d ' ' -f 2 | cut -d '+' -f 1)
          BUILD_NUMBER=${{ github.run_number }}
          
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          
          # Every build gets its own permanent release, so older versions stay
          # downloadable. Pushed v* tags keep their tag; builds from main get
          # a new tag per build (e.g. v1.0.0-64).
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=v$VERSION_NAME-$BUILD_NUMBER" >> $GITHUB_ENV
          fi
          echo "RELEASE_NAME=OmniMow v$VERSION_NAME (Build $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          echo "APK_FILE=OmniMow-v$VERSION_NAME-$BUILD_NUMBER.apk" >> $GITHUB_ENV
          echo "Building release: OmniMow-v$VERSION_NAME-$BUILD_NUMBER.apk"

      # Android only installs an update signed with the same key as the installed app,
      # so there is no build without it.
      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The secret KEYSTORE_BASE64 is missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD (Settings -> Secrets and variables -> Actions) with the keystore the app's releases are signed with: an APK signed with another key cannot update the installed app."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is missing. Add KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD (Settings -> Secrets and variables -> Actions) for the keystore in KEYSTORE_BASE64."
              exit 1
            fi
          done
          # The app updates from the releases of the repository it is built in
          flutter build apk --release \
            --build-name=$VERSION_NAME \
            --build-number=$BUILD_NUMBER \
            --dart-define=UPDATE_REPO=${{ github.repository }}

      # The APK must be signed with the same certificate as every earlier release
      # (android/app/signing-cert.sha256), or Android refuses it as an update
      - name: Check the Signing Key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          out=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk 2>&1) || true
          cert=$(echo "$out" | grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]{64}' | sed 's/.*: //')
          expected=$(tr -d '[:space:]' < android/app/signing-cert.sha256)
          echo "Signing certificate SHA-256: \`$cert\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$cert" != "$expected" ]; then
            echo "$apksigner verify --print-certs said:"
            echo "$out"
            echo "::error::The APK is signed with another certificate (${cert:-none}) than the app's releases ($expected in android/app/signing-cert.sha256). Android would refuse it as an update: check the secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD."
            exit 1
          fi
          echo "Signed with the app's release key ($cert)"

      # The next steps run third-party actions, and the Gradle daemon still has the
      # passwords in its environment
      - name: Remove the Keystore
        if: always()
        run: |
          rm -f android/app/release-key.jks
          pkill -f 'GradleDaemon|KotlinCompileDaemon' || true

      - name: Prepare APK Artifact
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/${{ env.APK_FILE }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OmniMow-Android-APK
          path: build/app/outputs/flutter-apk/${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 7

      # Earlier releases are kept, so an older version can be installed if a build is broken.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ### OmniMow Build Information
            * **Commit SHA:** `${{ github.sha }}`
            * **Build Number:** `${{ env.BUILD_NUMBER }}`
            * **Version Name:** `${{ env.VERSION_NAME }}`
            * **Release Type:** ${{ startsWith(github.ref, 'refs/tags/v') && '📦 Tagged Release' || '🔄 Development Build from main' }}

            *Older builds remain available under Releases if you need to roll back.*
          files: build/app/outputs/flutter-apk/${{ env.APK_FILE }}
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS Package
    runs-on: macos-latest
    permissions:
      contents: write
    needs: build-android # Wait for Android job to create the release first (to append assets)

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: '3.50.1'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install Dependencies
        run: flutter pub get

      - name: Extract Version Info & Setup Release Type
        id: release_setup
        run: |
          VERSION_LINE=$(grep 'version: ' pubspec.yaml)
          VERSION_NAME=$(echo "$VERSION_LINE" | cut -d ' ' -f 2 | cut -d '+' -f 1)
          BUILD_NUMBER=${{ github.run_number }}
          
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          
          # Must match the release tag created by the Android job
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=v$VERSION_NAME-$BUILD_NUMBER" >> $GITHUB_ENV
          fi
          echo "IOS_FILE=OmniMow-v$VERSION_NAME-$BUILD_NUMBER-ios-unsigned.zip" >> $GITHUB_ENV

      # Unsigned, so no Apple developer account is needed
      - name: Build iOS App (No Codesign)
        run: flutter build ios --release --no-codesign --dart-define=UPDATE_REPO=${{ github.repository }}

      # Zip for sideloading with Sideloadly / AltStore
      - name: Package iOS payload for sideloading
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../../../${{ env.IOS_FILE }} Payload
          cd ../../../

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OmniMow-iOS-Unsigned-ZIP
          path: ${{ env.IOS_FILE }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload iOS to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.IOS_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
